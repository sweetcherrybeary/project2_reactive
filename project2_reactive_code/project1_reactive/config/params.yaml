# Parameters for the Project 1 nodes.
# Distances in meters, angles in degrees, times in seconds.
# Anything not listed here uses the default in the node's source code.

reactive_controller:
  ros__parameters:
    cmd_vel_stamped: true          # Jazzy TurtleBot 4 uses TwistStamped on /cmd_vel
    teleop_topic: /key_vel         # teleop_twist_keyboard is remapped here
    teleop_stamped: true
    teleop_timeout: 1.0            # a key press stays in force this long

    # Lidar mounting (used until the real pose is read from TF).
    # The TurtleBot 4 lidar is rotated +90 deg and sits 4 cm behind center.
    lidar_x_offset: -0.04
    lidar_y_offset: 0.0
    lidar_yaw_offset_deg: 90.0

    robot_radius: 0.17
    obstacle_distance: 0.3048      # 1 ft, measured from the robot's body
    front_half_angle_deg: 60.0     # "in front" = within +/-60 deg of heading
    center_band_deg: 5.0           # dead-ahead band counted on both sides
    symmetry_tolerance: 0.05       # left/right within 5 cm = symmetric

    forward_speed: 0.2
    turn_speed: 1.0
    escape_turn_deg: 180.0
    escape_jitter_deg: 30.0
    random_turn_step: 0.3048       # 1 ft
    random_turn_max_deg: 15.0
    halt_hold_time: 1.0

occupancy_mapper:
  ros__parameters:
    cmd_vel_stamped: true
    map_frame: odom
    resolution: 0.05
    map_size: 30.0
    max_mapping_range: 5.0
    lidar_x_offset: -0.04
    lidar_y_offset: 0.0
    lidar_yaw_offset_deg: 90.0
